services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${PRISM_DATABASE_PASSWORD:?Set PRISM_DATABASE_PASSWORD in .env before starting Compose}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - prism-postgres:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://prism:${PRISM_DATABASE_PASSWORD:?Set PRISM_DATABASE_PASSWORD in .env before starting Compose}@db:5432/prism
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  prism-postgres:
