name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL is free for public repositories. Private repositories need GitHub Code Security.
    # Set ENABLE_GITHUB_CODE_SECURITY=true as a repository variable after enabling that product.
    if: github.event.repository.private == false || vars.ENABLE_GITHUB_CODE_SECURITY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
