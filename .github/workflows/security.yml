name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: python scripts/check_secrets.py

  dependency-review:
    # Dependency review is free for public repositories. Private repositories need
    # GitHub Code Security; set ENABLE_GITHUB_CODE_SECURITY=true after enabling it.
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ENABLE_GITHUB_CODE_SECURITY == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
