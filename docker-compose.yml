services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oc
      POSTGRES_PASSWORD: oc
      POSTGRES_DB: oneclarity
    ports: ["5433:5432"]  # 5433 so it does not clash with a local Postgres on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oc"]
      interval: 5s

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://oc:oc@postgres:5432/oneclarity
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://oc:oc@postgres:5432/oneclarity
    command: python -m app.worker.main
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
